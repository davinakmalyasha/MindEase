services:
  mysql:
    image: mysql:8.4
    container_name: mindease-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mindease_secure_root}
      MYSQL_DATABASE: mindease_db
      MYSQL_USER: mindease
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mindease_secure}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-mindease_secure_root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mindease-redis
    restart: unless-stopped
    # Bound to loopback, and with a password.
    #
    # This was published on 0.0.0.0 with no `requirepass`, so any host on the same
    # network could read the rate-limit counters, the realtime pub/sub channel
    # and the doctor-profile cache of a mental-health platform, and could write
    # to all three. Nothing seeds Redis, so unlike MySQL there is no reason for it
    # to be reachable from the host at all - inspect it with
    # `docker compose exec redis redis-cli -a "$REDIS_PASSWORD" ping`.
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-mindease_local_redis}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-mindease_local_redis}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    # An explicit `image:` on every built service.
    #
    # Compose otherwise names a built image `<project>-<service>`, where
    # `<project>` is the working directory lowercased - so the same image is
    # `mindease-api` in one checkout and `repo-api` on a CI runner whose
    # directory is the repository name. Nothing outside compose could name it
    # reliably.
    #
    # It broke exactly that. The Trivy job resolved the image with
    # `docker compose images -q`, which lists *containers*, and a job that only
    # runs `docker compose build` has none - so the reference came back empty and
    # Trivy exited non-zero with `could not parse reference: .` on all three
    # images. A scan that cannot find its image reports nothing while looking
    # like a gate.
    #
    # `IMAGE_TAG` lets CI build under a predictable tag and scan precisely that.
    image: mindease-api:${IMAGE_TAG:-latest}
    build: ./server
    container_name: mindease-api
    restart: unless-stopped
    environment:
      PORT: 5000
      DATABASE_URL: mysql://mindease:${MYSQL_PASSWORD:-mindease_secure}@mysql:3306/mindease_db
      JWT_SECRET: ${JWT_SECRET}
      REFRESH_SECRET: ${REFRESH_SECRET}
      # Required in production: the API refuses to boot without it, and it must
      # differ from JWT_SECRET. It was previously missing here, so `docker compose
      # up` crash-looped the API.
      #
      # No default. The value this used to fall back to was a committed literal -
      # `local_dev_two_factor_secret_change_me` - which was 38 characters and not
      # `dev_`-prefixed, so config/env.ts accepted it and `docker compose up`
      # produced an API signing two-factor tickets with a string published in
      # this repository. JWT_SECRET and REFRESH_SECRET have no default for the
      # same reason; this one now matches them, and the failure mode is a loud
      # message naming the missing variable instead of a forgeable ticket.
      TWO_FACTOR_SECRET: ${TWO_FACTOR_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # AI call resilience: bound a single call, and stop retrying a provider
      # that is already down.
      AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-20000}
      AI_CIRCUIT_THRESHOLD: ${AI_CIRCUIT_THRESHOLD:-5}
      AI_CIRCUIT_COOLDOWN_MS: ${AI_CIRCUIT_COOLDOWN_MS:-60000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      REDIS_URL: redis://:${REDIS_PASSWORD:-mindease_local_redis}@redis:6379
      # Video transport, and the credentials for it. The API mints the room
      # token, so these belong here and not on the realtime service.
      # `livekit` needs all three of LIVEKIT_*; without them the API falls back
      # to the unauthenticated jitsi path and reports the downgrade.
      VIDEO_PROVIDER: ${VIDEO_PROVIDER:-jitsi}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      NODE_ENV: production
      TZ: Asia/Jakarta
      FRONTEND_URL: http://localhost:3000
      # The local stack runs the in-process payment simulator so a fresh clone
      # works without a merchant account. NODE_ENV is `production` here (it is
      # what the image is built for), and the config layer refuses the simulator
      # in production unless this explicit opt-in is present - so this is a
      # deliberate local-only choice, not an accident. Set real
      # PAYMENT_PROVIDER/PAYMENT_SERVER_KEY to take actual payments.
      #
      # The opt-in defaults to true, which means anyone who copies this file into
      # a real environment ships an endpoint that settles orders from an
      # unauthenticated POST: `{"orderId":"ME-...","amount":N,"outcome":"paid"}`
      # with no signature and no shared secret. It is documented as local-only and
      # it stays easy to get here by accident, so the default is now false - the
      # documented local path is `make up`, which sets it explicitly.
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-simulator}
      PAYMENT_SERVER_KEY: ${PAYMENT_SERVER_KEY:-}
      ALLOW_PAYMENT_SIMULATOR: ${ALLOW_PAYMENT_SIMULATOR:-false}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5000:5000"
    volumes:
      - uploads_data:/app/public/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  realtime:
    image: mindease-realtime:${IMAGE_TAG:-latest}
    build: ./server-realtime
    container_name: mindease-realtime
    restart: unless-stopped
    environment:
      PORT: 8080
      REDIS_URL: redis://:${REDIS_PASSWORD:-mindease_local_redis}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
      FRONTEND_URL: http://localhost:3000
      # Connection caps: per-user (multi-tab) and process-wide.
      MAX_CONNECTIONS_PER_USER: ${MAX_CONNECTIONS_PER_USER:-5}
      MAX_TOTAL_CONNECTIONS: ${MAX_TOTAL_CONNECTIONS:-10000}
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    image: mindease-web:${IMAGE_TAG:-latest}
    build:
      context: ./client
      # `NEXT_PUBLIC_*` values are inlined into the browser bundle at BUILD time.
      # Declaring them under `environment:` only set them inside the container,
      # where the already-built bundle cannot see them, so the shipped app silently
      # used the hard-coded localhost fallbacks. They have to be build args.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}
        NEXT_PUBLIC_REALTIME_URL: ${NEXT_PUBLIC_REALTIME_URL:-ws://localhost:8080/ws}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    restart: unless-stopped
    # Read at runtime by the edge proxy that checks session cookies.
    environment:
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    # Without this the `web` service is the last one `docker compose up --wait`
    # stops waiting on, so compose reports the stack ready while Next.js is
    # still compiling or has already crashed. The other four services all
    # declare one; this one was the gap.
    #
    # Probing `/offline` rather than `/`: the homepage is dynamic, server-renders,
    # and fetches the API using NEXT_PUBLIC_API_URL, which is inlined at build
    # time as http://localhost:5000/api - right for a browser on the host, wrong
    # inside the compose network where `localhost` is this container. So `/`
    # rendered a 500, and a liveness probe should not be asking whether the API
    # is reachable anyway. The API has its own two checks.
    #
    # `127.0.0.1` rather than `localhost`, and `-O /dev/null` rather than `-O-`.
    # Measured with a diagnostic probe added to the CI job, not guessed:
    #
    #     curl  http://localhost:3000/offline    ->  200
    #     wget  127.0.0.1:3000/offline (inside)  ->  HTTP/1.1 200 OK
    #     docker compose ps  ->  mindease-web-1 ... (unhealthy)
    #
    # The page renders and Docker still calls the container unhealthy, so the
    # healthcheck *command* was exiting non-zero. `localhost` needs name
    # resolution inside the container, where it can prefer ::1 while the server
    # binds IPv4 only (HOSTNAME=0.0.0.0); and `-O-` streams the whole ~53 KB
    # page into the healthcheck's stdout buffer over a chunked response. Removing
    # both makes the check exactly the request observed returning 200.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/offline"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mysql_data:
  uploads_data:
