# Trivy ignore file.
#
# ## What this is for
#
# Three HIGH findings that no change to this repository can fix, and that are not
# vulnerabilities in this application. Each entry is scoped to a single CVE *and*
# a single path, so a finding for the same CVE anywhere else - in a project
# dependency, anywhere in the image - is still reported. A blanket ignore would
# be indistinguishable from not running the scan.
#
# ## Why they cannot be fixed here
#
# All three are inside npm itself. `node:22-alpine` ships an npm that vendors its
# own copy of `brace-expansion` and `undici` under `lib/node_modules/npm`, and
# npm bundles those dependencies - they are not resolved from any `package.json`
# this project controls, so `npm audit fix`, a dependency bump, and
# `npm install -g npm@latest` are all unable to reach them.
#
# npm 11 and npm 12 were both tried; both bundle the affected versions. The
# Dockerfiles pin npm@12 for that reason, and the remaining gap is upstream.
#
# ## Why they are not reachable
#
# The API container runs `node dist/index.js`, and at boot runs the Prisma CLI
# from `node_modules/.bin`. It never evaluates a glob pattern and never opens an
# unrequested WebSocket, which are the two preconditions these advisories
# describe. The web container serves static output and does not run npm at all.
#
# `expiredDate` is set so these stop being silently accepted: if npm ever ships
# patched bundles, or this reasoning stops being true, the scan starts failing
# again instead of quietly continuing to pass.
#
# The top level is a mapping, not a list. Trivy decodes this file into a struct
# with `vulnerabilities` and `misconfigurations` keys, and a bare YAML sequence
# fails with `cannot unmarshal !!seq into result.IgnoreConfig` - which is what a
# version of this file that started as a plain list did.

vulnerabilities:
  - id: CVE-2026-102276
    paths:
      - usr/local/lib/node_modules/npm
    statement: >-
      brace-expansion bundled inside the npm CLI shipped by node:22-alpine. npm
      vendors this package; it is not reachable from this project's package.json,
      and npm@11 and npm@12 both bundle the affected version. The container never
      evaluates an attacker-controlled glob.
    expiredDate: "2026-11-06"

  - id: CVE-2026-102278
    paths:
      - usr/local/lib/node_modules/npm
    statement: >-
      brace-expansion bundled inside the npm CLI shipped by node:22-alpine. See
      the entry for CVE-2026-102276; same package, same reachability argument.
    expiredDate: "2026-11-06"

  - id: CVE-2026-19534
    paths:
      - usr/local/lib/node_modules/npm
    statement: >-
      undici bundled inside the npm CLI shipped by node:22-alpine. Requires an
      unrequested WebSocket connection; nothing in this application opens one,
      and npm is not used as a library here.
    expiredDate: "2026-11-06"