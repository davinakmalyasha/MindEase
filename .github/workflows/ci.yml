name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly, and for the same reason `security.yml` scans on a schedule: a gate
  # that only runs when the tree changes cannot notice that the thing it guards
  # has moved underneath it. The schema-drift check is the one most likely to rot
  # silently - it compares a database built from the migrations against the
  # datamodel, and a migration that has stopped applying cleanly looks exactly
  # like a gate that has not been run in a while.
  schedule:
    - cron: "17 4 * * 1"
  # Manual runs are still allowed; the e2e journeys themselves are a required
  # step of the `docker` job. See the comment there.
  workflow_dispatch:

# Least privilege. Stated once, at the top, and narrowed per job where a job needs
# more - so the default for anything added later is read-only rather than the
# repository's default token. Only `docker` widens, because it uploads Playwright
# traces.
permissions:
  contents: read

# One run per ref. A second push cancels the first instead of racing it: two
# complete five-job runs would both burn the full runner budget, and the slower
# one is what ends up reporting on the commit.
#
# Contrast `cd.yml`, where `cancel-in-progress` is false - two deploys must never
# interleave, because `prisma migrate deploy` is not re-entrant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------
  # Documentation gates
  #
  # Two checks that read the repository rather than run it. They belong first
  # because they cost under a second and catch the class of error otherwise only
  # found by a reader who happens to distrust a number.
  #
  # `check-numbers` exists because every count in this repository is
  # hand-maintained, and a previous pass correcting them all was followed by
  # fifteen drifting again - a stale test count in a CI comment, a per-file table
  # summing to a different number than its own heading. It exits 2 when an anchor
  # stops matching, because a restructured document that quietly stops being
  # checked is worse than a document with a wrong number in it.
  #
  # `check-encoding` catches mojibake, which is the same class of incident from
  # the other direction: a bulk text repair run through a console codepage. It has
  # caught that three times, once inside prisma/schema.prisma.
  # --------------------------------------------------------------------
  docs:
    permissions:
      contents: read
    timeout-minutes: 5
    name: Docs (numbers, encoding, workflows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Documented counts must match the repository
        run: node scripts/check-numbers.js
      - name: Encoding guard (whole repo)
        run: node scripts/check-encoding.js
      # The workflow checker exists to catch a job that cannot work, and it
      # runs only in CI if CI runs it. It did not, for four weeks: the script
      # was written, described in two documents, and never referenced by any
      # workflow or Makefile target. A gate that is documented and not wired is
      # indistinguishable from no gate, and it is the most comfortable kind of
      # bug to ship, because writing the gate feels like doing the work.
      - name: Workflow self-test, then workflow gate
        run: |
          node scripts/check-workflows.test.js
          node scripts/check-workflows.js
      # The client has 93 tsx files and, until now, no static check of any kind
      # on its markup. This one exists because `login/page.tsx` gave the sign-up
      # form's Email and Password labels the sign-in form's input ids, so
      # clicking either label focused nothing. Both ids existed, so no
      # "missing label target" rule could ever have caught it; the rule that
      # does is two labels for one id.
      - name: Label/id self-test, then label/id gate
        run: |
          node scripts/check-a11y-ids.test.js
          node scripts/check-a11y-ids.js
      # The CSP blocked this application's own API. `connect-src` was hardcoded to
      # Railway's host, so on any other deployment the browser refused every
      # request and the UI said "Network Error". That includes compose, which
      # defaults the API to localhost, which means the twelve Playwright journeys
      # in the `docker` job could not have passed either. The origins are now
      # derived from NEXT_PUBLIC_API_URL, and this gate fails if the resulting
      # header is malformed or omits them - the first attempt at the fix was
      # malformed and looked identical to the original bug.
      - name: CSP self-test, then CSP gate
        run: |
          node scripts/check-csp.test.js
          node scripts/check-csp.js
      # next-intl throws on a key it cannot resolve, so a missing message is not a
      # blank label - it is a page that will not render. The navbar called
      # t("signUp") under the "nav" namespace and neither locale had it, so every
      # page in the application threw, including the sign-in page. The existing
      # locale-parity test could not catch it: both files were missing the key, so
      # they agreed with each other perfectly.
      - name: Translation-key self-test, then translation-key gate
        run: |
          node scripts/check-i18n.test.js
          node scripts/check-i18n.js
      # Every button has a name, every field error is announced, and the count of
      # sub-AA text colours has not risen.
      #
      # The third rule is a budget rather than a requirement, on purpose. There
      # were 286 uses of `text-gray-50..400` across 59 files and `gray-400` on
      # white is 2.54:1, so the debt is real and is now measured. A gate
      # requiring zero would have been disabled on the first day; this one can
      # only shrink.
      #
      # The gate's own first version pulled `"animate-spin"` out of a JSX
      # attribute and called it an accessible name, so it produced false negatives
      # on exactly the icon-only buttons it exists to find. The integration test
      # breaks a real button and a real error to prove it can still fail.
      - name: A11y self-test, then a11y gate
        run: |
          node scripts/check-a11y.test.js
          node scripts/check-a11y.js

      # Failed request vs. empty result. A rejected fetch that leaves state at
      # its initial value renders an "empty" state, and the user is told there
      # is nothing there when in fact nothing could be asked. Six panels did
      # this; one of them was an editing form whose save writes every field, so
      # a failed load plus one changed field overwrote the rest with "".
      - name: Load-state self-test, then gate
        run: |
          node scripts/check-load-states.test.js
          node scripts/check-load-states.js

      # A response that lands after a newer one. Next.js keeps the component
      # mounted across /[appointmentId]/A and /[appointmentId]/B and `params`
      # resolves asynchronously, so two requests can be in flight and write in
      # either order - which on the briefing page means showing one patient's
      # clinical summary to a clinician reading another's.
      - name: Stale-write self-test, then gate
        run: |
          node scripts/check-stale-writes.test.js
          node scripts/check-stale-writes.js




  # --------------------------------------------------------------------
  # Compose file validation
  #
  # Runs first among the jobs that need a toolchain, costs about ten seconds,
  # and needs nothing but the checkout. It exists because a single
  # mis-indented key in docker-compose.yml made the file unparseable, which made
  # `docker compose build` fail on the first step of the `docker` job and
  # left every later step - four health checks, the database seed, all
  # 12 Playwright tests - permanently unreachable. Nothing in the
  # pipeline noticed, because a job whose first step fails simply reports
  # red and the unreachable steps are never examined.
  #
  # A schema error in the compose file should cost ten seconds, not a full
  # three-job test run.
  compose:
    # `docker compose config` parses one file. Nothing else.
    permissions:
      contents: read
    timeout-minutes: 5
    name: Compose (validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `-q` validates and exits non-zero on any error without printing the
      # resolved config, so a failure shows the parse error and nothing else.
      - name: Validate docker-compose.yml
        run: docker compose config -q


  client:
    # Lint, unit tests and a production build. The build is the slow part.
    permissions:
      contents: read
    timeout-minutes: 20
    name: Client (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Encoding guard (whole repo)
        working-directory: .
        run: node scripts/check-encoding.js
      - name: Dependency reference check
        run: |
          node scripts/check-dependencies.test.js
          node scripts/check-dependencies.js
      - run: npm run lint
      # The vitest suite was never run in CI, so the api-session and
      # notifications-store regression tests only ever ran locally.
      - run: npm test
      # The client half of coverage, cheap enough to produce on every pull
      # request - unlike the server suite, which runs it on main only. The
      # thresholds live in `vitest.config.ts` and sit just below the measured
      # baseline; see the `coverage` job for the numbers and the reasoning.
      - name: Coverage (gated)
        run: npm run coverage
      - name: Upload the coverage report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-client
          path: client/coverage/
          retention-days: 14
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  realtime:
    # go vet, build and race tests on a 532-line service.
    permissions:
      contents: read
    timeout-minutes: 10
    name: Realtime (Go vet, build, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server-realtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          # The same reason as `govulncheck` in security.yml: a bare minor
          # version resolves to the runner image's cached patch unless the
          # action is told to check for the newest one, so a new
          # standard-library advisory keeps failing until the image happens to
          # update. The full patch now matches every `go` directive in the
          # repository.
          check-latest: true
      - name: Lint (golangci-lint)
        # v9, not v6. v6 resolves its own binary version and picked
        # v1.64.8, which is built with go1.24 and refuses to load a module
        # declaring `go 1.27.2`: it exits 3 with "the Go language version used
        # to build golangci-lint is lower than the targeted Go version".
        # The version is pinned below for the same reason - a floating
        # resolver is what picked a binary that cannot read this go.mod.
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.14.0
          working-directory: server-realtime
      - run: go vet ./...
      - run: go build ./...
      # `-race` is the whole point: hub_test.go's concurrency cases exist to catch
      # data races, and the suite was previously compiled without the flag.
      - name: Test with race detector
        run: go test -race -cover ./...

  api-go:
    # The Go API: vet, lint, build, unit tests, and the integration suite
    # against a real MySQL. The Playwright suite in the `docker` job exercises
    # the HTTP contract end to end; this job covers the races and constraints
    # between handlers and the database that a browser does not reliably reach.
    permissions:
      contents: read
    timeout-minutes: 15
    name: API (Go vet, lint, build, test)
    runs-on: ubuntu-latest
    # The integration tests create and migrate their own database inside this
    # instance; TEST_DATABASE_URL is the only wiring they need.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mindease_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: server-go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          check-latest: true
      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.14.0
          working-directory: server-go
      - run: go vet ./...
      - run: go build ./...
      - name: Test (unit and MySQL integration)
        env:
          TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/mindease_test
        run: go test ./...


  docker:
    # Builds all three images, boots the stack, and uploads Playwright traces on
    # failure.
    #
    # This job is read-only like every other one. It used to hold
    # `checks: write` and `actions: read` on the stated grounds that uploading
    # traces "needs to write a check run". Nothing here writes one: there is no
    # dorny/test-reporter, no publish-unit-test-result, no junit upload. The only
    # third-party step is actions/upload-artifact, which uses the Actions runtime
    # token rather than GITHUB_TOKEN and needs no repository permission at all.
    #
    # So the justification was false and the cost was real: this is the one job
    # that runs third-party actions, and it was the one job holding the widest
    # grant. It is now identical to the rest.
    permissions:
      contents: read
    timeout-minutes: 45
    name: Docker build
    runs-on: ubuntu-latest
    # `compose` first: a malformed compose file should fail here rather than
    # after the server, client and realtime suites have all run.
    # `docs` is included so a stale count blocks before the expensive jobs rather
    # than after them. `api-go` is included so a broken Go build is caught by
    # the cheap job before this one spends fifteen minutes on images. The Node
    # API and its coverage job are gone with server/; the Go API job covers that
    # code and the browser suite below covers its HTTP contract.
    needs: [docs, compose, client, realtime, api-go]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build images
        run: docker compose build
      # `build` alone never proved the stack works: the API refused to boot
      # (missing TWO_FACTOR_SECRET) and the realtime service could not reach
      # Redis, so compose reported success for a stack that could not start.
      - name: Boot the full stack
        run: docker compose up -d --wait
        env:
          # The API refuses to boot in production without these three, and
          # compose.yml passes JWT_SECRET and REFRESH_SECRET through with no
          # default - so "docker compose up" with no environment here hands it
          # empty strings and the container exits immediately. Compose then
          # reports "mindease-api is unhealthy" 75 seconds later, which says
          # nothing about why.
          #
          # Throwaway values, safe to commit and shared with nothing: an
          # ephemeral container on an ephemeral runner. The config layer also
          # requires all three to differ from each other in production, so they
          # are deliberately different strings.
          JWT_SECRET: ci-docker-jwt-secret
          REFRESH_SECRET: ci-docker-refresh-secret
          TWO_FACTOR_SECRET: ci-docker-two-factor-secret
          # Compose sets `NODE_ENV: production` and carries no payment
          # credentials, and the config layer refuses to boot in production
          # without either real ones or an explicit opt-in to the simulator -
          # because a deployment that quietly settles every order from an
          # unsigned POST is the exact failure that check exists to prevent.
          #
          # So the ephemeral CI stack declares the opt-in, exactly as `make up`
          # does. This job was silently relying on the validator not existing:
          # the API exited, compose reported `mindease-api is unhealthy`, and
          # without the log step below there was no way to tell why.
          ALLOW_PAYMENT_SIMULATOR: "true"

      # `docker compose up --wait` reports "mindease-api is unhealthy" and
      # nothing else. The reason the container exited - which is the only part
      # worth knowing - is in its stdout, and this step used to throw it away.
      # It cost a full CI cycle to find that out.
      - name: Container logs, if the stack did not come up
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Container states, if the stack did not come up
        if: failure()
        run: docker compose ps -a

      - name: API liveness
        run: curl -fsS http://localhost:5000/api/health
      - name: API database check (the endpoint that actually queries MySQL)
        run: curl -fsS http://localhost:5000/api/health/db
      - name: Realtime reports Redis reachable
        run: curl -fsS http://localhost:8080/health
      - name: Web responds
        run: curl -fsS -o /dev/null -w '%{http_code}' http://localhost:3000/

      # ----------------------------------------------------------------
      # End-to-end journeys
      #
      # Required. The suite was opt-in when it had never been executed by any
      # automated process - the `docker` job's first step was `docker compose
      # build`, and it failed, so every later step was unreachable and the
      # selector failures could never have been told apart from the plumbing
      # failure above them.
      #
      # It has now been run green (15 tests: 3 cached logins, 12 journeys)
      # against this repository's stack, and a red here is a real defect again.
      # Everything around it - build, boot, the four health checks above, the
      # seed below - is required for the same reason.
      #
      # The suite requires seeded data.
      #
      # The seed runs in the API image, which contains the `seed` binary: no
      # host Node checkout is involved, and the connection string is the one the
      # API itself uses, so the demo data is identical to `make up`.
      #
      # Note the seed creates zero reviews. It used to invent a 4.2-4.9 rating
      # for every clinician with zero reviews, which made "Top Rated" rank
      # the most-liked-looking profiles first; that data was removed because
      # demo data should not model the bug. One journey builds its own review,
      # follow-up and conversation by completing a consultation.
      # The client's dependencies, for Playwright itself. The `client` job
      # installs them on its own runner; this job is a different runner with a
      # fresh checkout, so `npx playwright test` died on
      # "Cannot find module '@playwright/test'" on the first run of the
      # journeys - a step that had been unreachable for as long as the suite
      # was opt-in, which is exactly how it stayed unseen.
      - name: Install client dependencies
        working-directory: client
        run: npm ci
      - name: Seed the database
        run: docker compose run --rm --no-deps api seed
      - name: Install Playwright browser
        working-directory: client
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end journeys
        working-directory: client
        run: npx playwright test
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: client/test-results/
          retention-days: 7

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      # `docker compose up --wait` only ever reports "container X is unhealthy".
      # That names a symptom, not a cause, and the last three rounds of this job
      # were spent guessing: a missing secret, a missing Prisma client, and a
      # bind address all produced the identical one-line message.
      #
      # This prints what each service actually returns, so the next failure is
      # diagnosed from the log rather than by another hypothesis. It runs before
      # teardown and never fails the job itself, because it is a diagnostic.
      - name: Probe every service (diagnostics)
        if: failure()
        continue-on-error: true
        run: |
          for probe in \
            "web|http://localhost:3000/offline" \
            "web-ip|http://127.0.0.1:3000/offline" \
            "web-static|http://localhost:3000/robots.txt" \
            "api|http://localhost:5000/api/health" \
            "api-db|http://localhost:5000/api/health/db" \
            "realtime|http://localhost:8080/health"
          do
            name="${probe%%|*}"
            url="${probe#*|}"
            echo "--- ${name}  ${url}"
            # `-S` prints the status line, `-O-` to stdout. Never let the probe's
            # own exit code abort the loop: a failure here *is* the finding.
            curl -sS -S --max-time 10 -o /dev/null -w '    status=%{http_code} time=%{time_total}s\n' \
              "$url" || echo "    curl exit=$?"
          done
          echo "--- from inside the web container"
          docker compose exec -T web sh -c \
            'wget -S -O /dev/null http://127.0.0.1:3000/offline 2>&1 | head -20' \
            || echo "    exec failed"
          echo "--- container health state"
          docker compose ps --format '{{.Name}}  {{.State}}  {{.Status}}' || true

      - name: Tear down
        if: always()
        run: docker compose down -v
