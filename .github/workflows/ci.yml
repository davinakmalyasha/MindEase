name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    name: Server (lint, typecheck, test)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mindease_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Lint
        run: npm run lint
      - run: npx tsc --noEmit
      - name: Prepare test DB via migrations
        run: npx prisma migrate deploy --skip-generate
        env:
          DATABASE_URL: mysql://root:root@localhost:3306/mindease_test
      - name: Check for schema drift (schema must match committed migrations)
        # This is the highest-value step in the pipeline: it fails when
        # `schema.prisma` and the committed migrations disagree, which is how a
        # hand-written index that only exists in a migration gets silently
        # dropped by the next `migrate dev`.
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel ./prisma/schema.prisma --exit-code
        env:
          DATABASE_URL: mysql://root:root@localhost:3306/mindease_test
      - name: Run tests
        run: npm test
        env:
          # `tests/setup.ts` derives the test connection from TEST_DATABASE_URL and
          # overwrites DATABASE_URL with it. It previously fell back to a
          # passwordless localhost URL, which cannot authenticate against this
          # service container — so every test in this job failed at the database
          # wipe in beforeEach. Both variables are set to the same value so the
          # migration step and the test run cannot disagree.
          TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/mindease_test
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/mindease_test
          JWT_SECRET: ci-jwt-secret
          REFRESH_SECRET: ci-refresh-secret
          TWO_FACTOR_SECRET: ci-two-factor-secret
          # Empty on purpose: the suite must never make a live, billable Gemini
          # call, and the tests assert the degraded-path behaviour.
          GEMINI_API_KEY: ""
          NODE_ENV: test

  client:
    name: Client (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      # The vitest suite was never run in CI, so the api-session and
      # notifications-store regression tests only ever ran locally.
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  realtime:
    name: Realtime (Go vet, build, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server-realtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: server-realtime
      - run: go vet ./...
      - run: go build ./...
      # `-race` is the whole point: hub_test.go's concurrency cases exist to catch
      # data races, and the suite was previously compiled without the flag.
      - name: Test with race detector
        run: go test -race -cover ./...

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [server, client, realtime]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
      # `build` alone never proved the stack works: the API refused to boot
      # (missing TWO_FACTOR_SECRET) and the realtime service could not reach
      # Redis, so compose reported success for a stack that could not start.
      - name: Boot the full stack
        run: docker compose up -d --wait
      - name: API liveness
        run: curl -fsS http://localhost:5000/api/health
      - name: API database check (the endpoint that actually queries MySQL)
        run: curl -fsS http://localhost:5000/api/health/db
      - name: Realtime reports Redis reachable
        run: curl -fsS http://localhost:8080/health
      - name: Web responds
        run: curl -fsS -o /dev/null -w '%{http_code}' http://localhost:3000/

      # ----------------------------------------------------------------
      # End-to-end journeys
      #
      # The 187-line Playwright suite had never been executed by any
      # automated process — CI only ever linted, unit-tested and booted the
      # stack. 187 lines of unrun test code is a liability, not coverage, so
      # it is now actually run here, against the stack this job already has
      # booted (`reuseExistingServer: true` in playwright.config.ts means it
      # will not try to start its own).
      #
      # The suite requires seeded data — it hardcodes `doctorId = 2` and expects
      # reviews to exist — and nothing in compose or CI ever seeded the
      # database, so that gap is closed first.
      #
      # Seeding runs from the runner rather than inside the API container: the
      # production image installs `--omit=dev` (so no `ts-node`) and copies only
      # `scripts/start.sh`, not `scripts/seed.ts`. The runner has the full
      # checkout with devDependencies, and compose publishes MySQL on 3306.
      - name: Install server dependencies (for the seed)
        working-directory: server
        run: npm ci
      - name: Seed the database
        working-directory: server
        env:
          DATABASE_URL: mysql://root:mindease_secure_root@127.0.0.1:3306/mindease_db
        run: npx prisma migrate deploy && npm run db:seed
      - name: Install Playwright browser
        working-directory: client
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end journeys
        working-directory: client
        run: npx playwright test
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: client/test-results/
          retention-days: 7

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
