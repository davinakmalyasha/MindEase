name: Security

# This workflow exists because SECURITY.md listed "no dependency scanning or
# SAST in CI" as a known gap: the history had been audited by hand and no
# secret was ever committed, but nothing kept it that way. A hand audit is a
# fact about the past; these four jobs are a mechanism for the future.
#
# It runs on every push to main, on every pull request, and weekly. Weekly is
# the important trigger: a vulnerability published in the NVD affects a
# checkout that has not changed at all, and no push-triggered scan can see
# that.
#
# It is a separate workflow from ci.yml rather than extra steps in it, so a
# scanner that is misconfigured or times out does not redden the build and
# teach everyone to ignore red.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Sunday 04:10 UTC, not on the hour. Scheduled workflows queue behind every
    # other job on GitHub's shared fleet, so :00 on a round number is the
    # slowest possible minute to ask for.
    - cron: "10 4 * * SUN"
  # Lets a maintainer re-run a scan without pushing a commit. Security findings
  # often need a second look once a version is pinned or a false positive is
  # confirmed, and neither of those should cost a commit.
  workflow_dispatch:

# One scan at a time per ref. A second push to a branch supersedes the first
# run of the same job; without this, three pushes in a minute produce three
# CodeQL analyses of the same tree and the oldest one can report last, so a
# red run survives a green one.
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

# Least privilege at the top, with the two CodeQL jobs narrowing to
# `security-events: write` at the job level because a SARIF upload needs it.
# Stating it here means a job added later is read-only by default rather than
# inheriting the repository's default token.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # Secret scanning
  # ---------------------------------------------------------------------
  # Full-history scan, not just the diff. A secret that was committed and then
  # amended away is still in the objects, and still in anybody's clone.
  #
  # Expected to go green on the first run: the history was audited and is
  # clean. That is worth stating, because a first red run here would be a
  # discovery about the repository rather than a regression, and the two need
  # to be told apart.
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # gitleaks needs the history to scan it, and the default
          # `fetch-depth: 1` would give it one commit.
          fetch-depth: 0
      - name: Scan full history
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        # `GITHUB_TOKEN` is an env var, not a `with:` input. The action declares
        # no inputs at all - passing one fails the step with "Unexpected input(s)
        # 'GITHUB_TOKEN'" - and it is required since v2 to scan a pull_request
        # rather than skipping. It needs only `contents: read`, which this job
        # already has, so this is not a privilege change: it is the difference
        # between the secret scan running and silently not running.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Without a licence key the action reports findings in the log but
          # does not fail the check. Failing the job is the entire point of
          # running it in CI, and the check would be advisory otherwise.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ---------------------------------------------------------------------
  # Static analysis
  # ---------------------------------------------------------------------
  # Two languages, so two jobs: CodeQL's language is a build-mode setting, not
  # something one run can switch between. Paths are split the same way the
  # repositories are, so a change to the Go service does not pay for a
  # TypeScript database and vice versa.
  codeql-js:
    name: CodeQL (TypeScript — server, client)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # `security-events: write` is what lets the analysis be uploaded and shown
      # on the Security tab. It is granted here and not at workflow level so
      # the other three jobs cannot write to it.
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Initialise CodeQL
        uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          languages: javascript-typescript
          # No build step. TypeScript is not compiled by CodeQL, and a custom
          # build command here would only make the extractor miss files.
          build-mode: none
          # Scoped to the two directories that hold TypeScript. Including the
          # root would pull in configuration and the Playwright spec, neither
          # of which is a library anything calls.
          paths: server,client
          queries: security-and-quality
      - name: Analyse
        uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          category: "/language:javascript-typescript"

  codeql-go:
    name: CodeQL (Go — realtime)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Initialise CodeQL
        uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          languages: go
          # Go needs a real build for the extractor to see call graphs. A
          # `go build ./...` in the module is enough; nothing is run.
          build-mode: autobuild
          paths: server-realtime
          queries: security-and-quality
      - name: Analyse
        uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          category: "/language:go"

  # ---------------------------------------------------------------------
  # Container images
  # ---------------------------------------------------------------------
  # Two jobs, because "scan the Dockerfile" and "scan the image" are different
  # questions and only one of them was being asked.
  #
  #   trivy-config  reads the Dockerfile as text. Catches a user running as root, a
  #                 missing WORKDIR, a secret in a build arg. Fast, no build needed.
  #   trivy-image   builds the image and reads its actual contents. Catches a CVE
  #                 in the base image or in a resolved dependency.
  #
  # The comment above the original job explained that the realtime service's
  # findings "are base-image CVEs and nothing else" - which is true, and
  # unreachable, because the job set `vuln-type: misconfig`. Under that setting
  # Trivy reports Dockerfile misconfiguration and no CVEs at all. So three images
  # shipped to production with no operating-system or library vulnerability
  # scanning whatsoever, and the comment explained why that was fine.
  #
  # HIGH and CRITICAL only, and unfixed findings ignored: every base image carries
  # a tail of CVEs with no available patch, and a gate nobody can satisfy is a
  # gate everybody disables.
  trivy-config:
    name: Trivy config (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: server
            dockerfile: server/Dockerfile
          - image: client
            dockerfile: client/Dockerfile
          - image: server-realtime
            dockerfile: server-realtime/Dockerfile
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Scan ${{ matrix.dockerfile }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Pinned rather than floated. The action otherwise resolves whatever
          # Trivy is newest, and a scanner that no longer accepts our flags fails
          # exactly like a finding does - which teaches everyone to ignore the red.
          version: v0.70.0
          # `config`, not `dockerfile`. Trivy v0.70 removed the `dockerfile`
          # subcommand and folded it into `trivy config`, which is also what scans
          # Kubernetes and Terraform. The action resolved v0.70.0 and failed with
          # `unknown command "dockerfile" for "trivy"`.
          scan-type: config
          scan-ref: ${{ matrix.dockerfile }}
          format: table
          # `exit-code: 1` is what makes this a gate. Without it the action prints
          # findings and the job goes green, which is the default and is the reason
          # a scanner can sit in a repo for a year without anyone knowing.
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: misconfig
          severity: HIGH,CRITICAL
          # No `trivyignores` file. A suppressions file is the right thing once
          # something needs suppressing; an empty one is only a way to make the
          # scan pass without looking at it.

  trivy-image:
    name: Trivy image (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
matrix:
        # Compose service names. Each compose service now declares an explicit
        # `image: mindease-<service>:${IMAGE_TAG:-latest}`, so the tag is
        # knowable without asking docker what it called something.
        service: [api, web, realtime]
    outputs:
      # The service name is the only thing these jobs can agree on. Each job
      # writes the reference it built and scanned, so the summary below can say
      # what was covered.
      image-ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Build the image
        env:
          IMAGE_TAG: ci
        run: docker compose build ${{ matrix.service }}

      # Predict the tag rather than asking docker. The previous version used
      # `docker compose images -q`, which lists containers - and a job that only
      # builds has none - so the reference was the empty string and Trivy exited
      # non-zero on all three images with "could not parse reference: .". Before
      # that it scanned `mindease-api:ci`, a tag nothing produced.
      #
      # Between the two: a gate that cannot find its image fails while reporting
      # nothing, which is the failure mode most likely to be switched off.
      - name: Resolve the image reference
        id: resolve
        run: echo "ref=mindease-${{ matrix.service }}:ci" >> "$GITHUB_OUTPUT"

      - name: Scan the built image for CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: ${{ steps.resolve.outputs.ref }}
          format: table
          # `os` for the base image and the OS packages it brings, `library` for
          # the language dependencies resolved into the image. Both were excluded
          # by the previous job's `vuln-type: misconfig`.
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # `exit-code: 1` makes this a gate rather than a report.
          exit-code: "1"

  # ---------------------------------------------------------------------
  # Dependency advisories
  # ---------------------------------------------------------------------
  # `--audit-level=high` rather than `--audit-level=moderate`, for the same
  # reason Trivy is HIGH and CRITICAL only. A moderate finding in a
  # transitive dev dependency is not the same event as a high finding in the
  # JWT path.
  #
  # `npm audit` runs against the lockfile only and needs no build; it is the
  # fastest useful signal in the whole workflow and runs first.
  npm-audit:
    name: npm audit (server, client)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: server
          - directory: client
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      # `npm ci` installs exactly what is locked, which is what `npm audit`
      # reads. No postinstall scripts run that are not already in the lockfile;
      # `--ignore-scripts` is deliberate — Prisma's client generation is not
      # needed to audit a lockfile, and skipping the scripts means a compromised
      # transitive package cannot execute anything just by being audited.
      - run: npm ci --ignore-scripts
      - name: Audit (${{ matrix.directory }}, shipped dependencies)
        # `--omit=dev`, because the gate should describe what actually ships.
        #
        # The production images install with `npm ci --omit=dev`, so a finding that
        # only exists in a devDependency cannot reach a running container. Auditing
        # the whole tree made the gate fail on `braces`, which reaches the server
        # only through `nodemon -> chokidar` and has no patched release — the sole
        # suggested fix was to downgrade `nodemon` across a major. Failing a build
        # on a vulnerability that is not deployed trains everyone to ignore the gate.
        #
        # Dev dependencies are still audited, in the step below, as advisory. A new
        # advisory in the toolchain should be visible without being able to hold up
        # a pull request over something that never ships.
        run: npm audit --omit=dev --audit-level=high

      - name: Audit dev dependencies (advisory)
        # Reported, never fatal. See above.
        continue-on-error: true
        run: npm audit --audit-level=high

  # govulncheck is not `go list -m -u`. It walks the call graph from the binary
  # and only reports a vulnerability if the vulnerable symbol is actually
  # reachable, which is the difference between a Go report you can act on and
  # one you cannot.
  go-vulncheck:
    name: govulncheck (realtime)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: server-realtime
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # Matches ci.yml and the `go` directive in go.mod. A mismatch makes
          # the analysis describe a toolchain the service is not built with.
          go-version: "1.26"
      - run: go mod download
      # `./...` rather than `.`: the hub package is where the WebSocket and
      # JWT handling lives, and auditing only the root would miss it.
      - run: go vet ./...
      - name: Vulnerable symbols in reachable code
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
